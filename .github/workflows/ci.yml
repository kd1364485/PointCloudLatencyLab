# push / pull request のたびに、Docker イメージの中でビルドとテストをする(CPU 版。GitHub のマシンに GPU はない)。
# Dockerfile の中で colcon build → colcon test → colcon test-result を行い、テストが 1 つでも落ちたらビルドが失敗する。
name: build-and-test

on:
  push:
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image (colcon build + colcon test)
        run: docker build -t pointcloud-latency-lab .
      - name: Run the pipeline for 15 s
        run: |
          timeout -s INT 15 docker run --rm pointcloud-latency-lab | tee run.log || true
          grep -q "\[cluster\]: frames=" run.log
